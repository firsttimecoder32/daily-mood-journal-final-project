<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Entry</title>

    <link rel="stylesheet" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Arapey&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <img src="./logo1.png" alt="logo" class="logo" />

      <h1>The Daily Mood Journal</h1>

      <nav>
        <a href="./index.html">Home</a>
        <a href="./entry.html">New Entry</a>
        <a href="./dashboard.html">Dashboard</a>
      </nav>
    </header>

    <main>
      <div class="moodform-container">
        <h2>Take a moment to reflect</h2>

        <form id="moodform">
          <label for="mood">Mood</label>
          <select id="mood" required>
            <option value="">-- select your mood --</option>
            <option value="Happy 😊">Happy 😊</option>
            <option value="Excited 😄">Excited 😄</option>
            <option value="Calm 😌">Calm 😌</option>
            <option value="Neutral 😐">Neutral 😐</option>
            <option value="Sad 😢">Sad 😢</option>
            <option value="Stressed 😫">Stressed 😫</option>
            <option value="Angry 😠">Angry 😠</option>
          </select>

          <label for="note">Reflection</label>
          <textarea
            id="note"
            placeholder="Write your thoughts..."
            rows="5"
            required
          ></textarea>

          <button type="submit">Save entry</button>
        </form>
        <div id="message"></div>
      </div>
    </main>

    <footer>
      <p>© The Daily Mood Journal</p>
    </footer>

    <script src="./JavaScript.js"></script>
  </body>
</html>
