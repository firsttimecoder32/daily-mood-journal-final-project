<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Entry</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>The Daily Mood Journal</h1>
      <nav>
        <a href="./index.html">Home</a>
        <a href="./entry.html">New Entry</a>
        <a href="./dashboard.html">Dashboard</a>
        <a href="./about.html">About</a>
      </nav>
    </header>
    <main>
      <div class="moodform-container">
        <h2>Take a moment to reflect</h2>
        <form id="moodform">
          <label for="mood">Mood:</label>
          <select id="mood" required>
            <option value="">-- select your mood --</option>
            <option value="Happy 😊">Happy 😊</option>
            <option value="Excited 😄">Excited 😄</option>
            <option value="Calm 😌">Calm 😌</option>
            <option value="Neutral 😐">Neutral 😐</option>
            <option value="Sad 😢">Sad 😢</option>
            <option value="Stressed 😫">Stressed 😫</option>
            <option value="Angry 😠">Angry 😠</option>
          </select>
          <br /><br />

          <label for="note" required>Reflection:</label><br />
          <textarea
            id="note"
            placeholder="Write your thoughts..."
            rows="5"
          ></textarea>
          <br /><br />

          <button type="submit">Save entry</button>
        </form>
      </div>
    </main>
    <footer>
      <p>© The Daily Mood Journal</p>
      <p>Take a moment. Reflect. Grow.</p>
    </footer>
  </body>
</html>
